name: Samsung Stock Report

on:
  schedule:
    - cron: '0 0 * * 1-5'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance exchange-calendars requests pytz pandas

      - name: Run stock report
        id: report
        run: |
          OUTPUT=$(python stock_predictor.py 2>&1)
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Send Telegram
        if: steps.report.outputs.message != ''
        run: |
          python3 -c "
import os, requests, sys
token = os.environ['TELEGRAM_BOT_TOKEN']
chat  = os.environ['TELEGRAM_CHAT_ID']
text  = os.environ['MSG']
if not text.strip():
    print('KRX closed today - skipping')
    sys.exit(0)
r = requests.post(
    f'https://api.telegram.org/bot{token}/sendMessage',
    json={'chat_id': chat, 'text': text}
)
print('Sent:', r.status_code)
"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MSG: ${{ steps.report.outputs.message }}
